<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tres Valles · Mantenimiento · Calderas · v2.1</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3b6e91" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="3V Calderas" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg: #ffffff;
  --bg-alt: #f7f7f5;
  --bg-card: #ffffff;
  --bg-card-hover: #fbfbfa;
  --accent: #3b6e91;
  --accent-hover: #2f5a76;
  --accent-soft: #eaf1f6;
  --text: #1f1f1e;
  --text-secondary: #6b6b68;
  --text-muted: #9b9a97;
  --border: #e9e9e7;
  --border-strong: #dcdcda;
  --danger: #c0392b;
  --danger-soft: #fbeceb;
  --ok: #2f9e44;
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-alt);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;padding:0 0 90px;min-height:100vh;background:var(--bg-alt);}

/* ---- entrada / pin ---- */
.gate{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;background:var(--bg-alt);
}
.gate .mark{
  width:52px;height:52px;border-radius:12px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:18px;
}
.gate h1{font-size:19px;font-weight:600;margin:0 0 4px;}
.gate p{font-size:13.5px;color:var(--text-secondary);margin:0 0 24px;line-height:1.5;}
.gate input{
  width:100%;max-width:260px;text-align:center;letter-spacing:14px;font-size:36px;font-weight:700;
  padding:18px 12px;border:2px solid var(--border-strong);border-radius:12px;background:#fff;color:var(--text);
  font-family:'IBM Plex Mono',monospace;
}
.gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.gate .hint{
  font-size:15px;color:var(--text);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:8px;padding:10px 16px;margin-top:20px;font-family:'IBM Plex Mono',monospace;font-weight:600;
}
.gate .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px;}
.gate-credit{
  margin-top:24px;
  color:var(--text-muted);
  font-size:10px;
  letter-spacing:0.1px;
}
.gate button{
  margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;
}
.gate button:hover{background:var(--accent-hover);}

header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 12px;
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand-left{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .mark{
  width:32px;height:32px;flex:none;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
}
.brand h1{font-weight:600;font-size:15px;margin:0;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brand .role-tag{
  font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--text-muted);
  border:1px solid var(--border);border-radius:5px;padding:2px 6px;flex:none;
}
.role-tag.admin{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);}
.exit-link{background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;padding:2px;flex:none;}

.search-wrap{margin-top:12px;position:relative;}
.search-wrap input{
  width:100%;padding:9px 12px 9px 32px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg-alt);color:var(--text);font-size:14px;
}
.search-wrap input:focus{outline:none;border-color:var(--accent);background:#fff;}
.search-wrap .sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px;}
.clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px;line-height:1;}

.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px;}
.crumb{color:var(--text-secondary);background:none;border:none;padding:2px;cursor:pointer;}
.crumb.active{color:var(--text);font-weight:500;}
.crumb:not(.active):hover{color:var(--text);}
.back-btn{
  display:inline-flex;align-items:center;gap:5px;margin:0 0 12px 0;
  padding:6px 9px;background:none;border:1px solid var(--border);
  border-radius:7px;color:var(--text-secondary);font-size:12px;cursor:pointer;
}
.back-btn:hover{background:#fff;color:var(--text);}

.crumb-sep{color:var(--text-muted);}

main{padding:16px;}
.section-label{font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;color:var(--text-muted);margin:4px 2px 10px;font-weight:500;}
.list{display:flex;flex-direction:column;gap:8px;}

.row-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 13px;display:flex;align-items:center;gap:12px;cursor:pointer;
}
.row-card:hover{background:var(--bg-card-hover);border-color:var(--border-strong);}
.machine-comments{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--border);
  color:var(--text-secondary);font-size:12px;line-height:1.45;
}
.machine-comments .label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;
  color:var(--text-muted);margin-bottom:2px;
}

.row-card .icon{
  width:36px;height:36px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;
}
.row-card .info{flex:1;min-width:0;}
.row-card .info .name{font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-card .info .meta{font-size:12px;color:var(--text-muted);margin-top:1px;}
.row-card .chev{color:var(--text-muted);font-size:17px;flex:none;}

.empty{text-align:center;padding:40px 16px;color:var(--text-muted);}
.empty .big{font-size:15px;color:var(--text-secondary);margin-bottom:4px;font-weight:500;}
.empty .small{font-size:13px;}

.thumb{
  width:36px;height:36px;flex:none;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:var(--bg-alt);
}
.thumb-ph{
  width:36px;height:36px;flex:none;border-radius:8px;background:var(--bg-alt);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;
}

.mat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);}
.mat-top{display:flex;align-items:flex-start;gap:10px;padding:12px 13px 10px;}
.mat-top .name-code{flex:1;min-width:0;}
.mat-name{font-weight:500;font-size:14.5px;}
.mat-code{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:1px 6px;display:inline-block;margin-top:3px;
}
.mat-divider{border-top:1px solid var(--border);margin:0 13px;}
.mat-body{padding:10px 13px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13px;}
.field-label{font-size:10.5px;letter-spacing:0.3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
.field-val{color:var(--text);word-break:break-word;}
.field-val.qty{color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:500;}
.mat-comments{grid-column:1/-1;border-top:1px solid var(--border);padding-top:8px;margin-top:2px;color:var(--text-secondary);font-style:italic;}
.mat-actions{display:flex;gap:8px;padding:0 13px 12px;}

button{font-family:inherit;}
.btn{border:1px solid var(--border-strong);background:#fff;color:var(--text);border-radius:7px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;}
.btn:hover{background:var(--bg-alt);}
.btn.sm{padding:6px 10px;font-size:12px;}
.btn.danger{color:var(--danger);border-color:#eecbc6;}
.btn.danger:hover{background:var(--danger-soft);}
.btn.ghost{background:none;border-color:var(--border);}
.btn.primary{background:var(--accent);color:#fff;border:none;}
.btn.primary:hover{background:var(--accent-hover);}
.btn[disabled]{opacity:0.6;cursor:default;}

.fab{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top, var(--bg-alt) 65%, transparent);}
.fab-btn{
  width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:13px 16px;
  font-weight:600;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 14px rgba(0,0,0,0.12);
}
.fab-btn:hover{background:var(--accent-hover);}

.overlay{position:fixed;inset:0;background:rgba(20,20,19,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{width:100%;max-width:520px;background:#fff;border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.sheet h2{font-weight:600;font-size:16.5px;margin:0 0 14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:5px;font-weight:500;}
.field input[type=text],.field textarea{
  width:100%;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);border-radius:7px;
  padding:10px 11px;font-size:14.5px;font-family:'Inter',sans-serif;
}
.field textarea{resize:vertical;min-height:56px;}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
.field .err{color:var(--danger);font-size:12px;margin-top:4px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sheet-actions{display:flex;gap:10px;margin-top:16px;}
.sheet-actions .btn{flex:1;text-align:center;}

.img-row{display:flex;gap:10px;align-items:center;}
.img-preview{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:var(--bg-alt);flex:none;}
.img-preview-ph{width:64px;height:64px;border-radius:8px;background:var(--bg-alt);border:1px dashed var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:11px;text-align:center;}
.img-btns{display:flex;flex-direction:column;gap:6px;flex:1;}
.img-btns label{
  display:block;text-align:center;border:1px solid var(--border-strong);border-radius:7px;padding:8px 10px;
  font-size:12.5px;font-weight:500;cursor:pointer;color:var(--text);
}
.img-btns label:hover{background:var(--bg-alt);}
.img-btns input[type=file]{display:none;}

.loading{padding:60px 16px;text-align:center;color:var(--text-muted);font-size:13px;}
.error-banner{margin:0 16px 4px;padding:9px 12px;background:var(--danger-soft);border:1px solid #eecbc6;border-radius:8px;font-size:12px;color:var(--danger);line-height:1.5;}
.offline-banner{
  margin:0;padding:9px 16px;background:#fff4e5;border-bottom:1px solid #f0d9a8;
  font-size:12.5px;color:#8a5a00;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.offline-banner button{background:none;border:1px solid #d9a94a;color:#8a5a00;border-radius:6px;padding:3px 9px;font-size:11.5px;cursor:pointer;}

.app-credit{
  text-align:center;
  color:var(--text-muted);
  font-size:10px;
  padding:6px 16px 18px;
  letter-spacing:0.1px;
}

/* v1.9: calderas e imagenes ampliables */
.boiler-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.boiler-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 16px;text-align:center;cursor:pointer}
.boiler-card:hover{background:var(--bg-card-hover);border-color:var(--border-strong)}
.boiler-icon{width:48px;height:48px;margin:0 auto 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.boiler-name{font-size:16px;font-weight:600}.boiler-meta{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.caldera-tag{display:inline-block;font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 6px;margin-top:4px}
.img-clickable{cursor:zoom-in}
.image-lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.94);display:flex;align-items:center;justify-content:center;padding:18px;touch-action:none}
.image-lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-select:none;transform-origin:center center;will-change:transform}
.close-image{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:27px;line-height:40px;z-index:2}
.image-hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.72);font-size:11px;pointer-events:none}
@media(max-width:380px){.boiler-grid{grid-template-columns:1fr}}

.home-btn{display:inline-flex;align-items:center;gap:5px;margin:0 0 12px;padding:6px 9px;background:none;border:1px solid var(--border);border-radius:7px;color:var(--text-secondary);font-size:12px;cursor:pointer}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer}
.choice-card:hover{background:var(--bg-card-hover);border-color:var(--border-strong)}
.choice-icon{font-size:22px;margin-bottom:7px}.choice-name{font-size:14px;font-weight:600}.choice-meta{font-size:11px;color:var(--text-muted);margin-top:3px}
.field input[type=number],.field select{width:100%;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:10px 11px;font-size:14.5px;font-family:'Inter',sans-serif}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Cargando…</div>
</div>

<script>
const SUPABASE_URL = 'https://njnkdmlipiiwzwkfelac.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_uoJzqanYTrO-bekV8Tan7g_2Hib3lgB';
const CODE_VIEWER = '1234';
const CODE_ADMIN = '2580';
const ROLE_KEY = 'tv_role';

let db = null;
let libraryLoadError = false;
try{
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  libraryLoadError = true;
}

let state = { maquinas: [] };
let view = { screen: 'calderas', caldera: null, maquinaId: null, submaquinaId: null, actividadId: null };
let dataLoaded = false;
let loadError = null;
let role = null;
let searchQuery = '';
let pendingImage = { file: null, previewUrl: null };

function getMaquina(id){ return state.maquinas.find(m => m.id === id); }
function getSubmaquina(mq, id){ return mq ? mq.submaquinas.find(s => s.id === id) : null; }
function getActividad(sm, id){ return sm ? sm.actividades.find(a => a.id === id) : null; }
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatOfflineTime(){
  if(!offlineSince) return '';
  const d = new Date(parseInt(offlineSince, 10));
  return d.toLocaleString('es-HN', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function isAdmin(){ return role === 'admin'; }

/* ---- gate de acceso ---- */
function initGate(){
  if(libraryLoadError || typeof supabase === 'undefined'){
    document.getElementById('app').innerHTML = `
      <div class="gate">
        <div class="mark">3V</div>
        <h1>No se pudo cargar</h1>
        <p>Falta un componente de la app que todavia no se guardo en este celular para uso sin conexion.<br/><br/>Conecta a internet, abre la app una vez, esperate unos segundos, cierrala por completo y vuelve a intentar sin conexion.</p>
      </div>`;
    return;
  }
  const saved = localStorage.getItem(ROLE_KEY);
  if(saved === 'admin' || saved === 'viewer'){
    role = saved;
    loadData();
    return;
  }
  renderGate();
}
function renderGate(err){
  document.getElementById('app').innerHTML = `
    <div class="gate">
      <div class="mark">3V</div>
      <h1>Tres Valles</h1>
      <p>Mantenimiento &middot; Calderas<br/>Ingresa el codigo de acceso</p>
      <input id="gate-code" type="tel" inputmode="numeric" maxlength="4" placeholder="----" />
      <div class="err">${err ? escapeHtml(err) : ''}</div>
      <button onclick="submitGate()">Entrar</button>
      <div class="hint">Codigo para consultar: ${CODE_VIEWER}</div>
      <div class="gate-credit">Creado por Erick Yahir Maldonado</div>
    </div>
  `;
  const input = document.getElementById('gate-code');
  input.focus();
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.keyCode === 13){
      e.preventDefault();
      submitGate();
    }
  });
}
function submitGate(){
  const val = document.getElementById('gate-code').value.trim();
  if(val === CODE_ADMIN){ role = 'admin'; }
  else if(val === CODE_VIEWER){ role = 'viewer'; }
  else { renderGate('Codigo incorrecto.'); return; }
  localStorage.setItem(ROLE_KEY, role);
  loadData();
}
function exitApp(){
  localStorage.removeItem(ROLE_KEY);
  role = null;
  renderGate();
}

/* ---- navegacion: calderas > maquinas > submaquinas > actividades > recursos > materiales/herramientas ---- */
function goHome(){ view={screen:'calderas',caldera:null,maquinaId:null,submaquinaId:null,actividadId:null}; searchQuery=''; render(); }
function goBack(){
  if(view.screen==='materiales' || view.screen==='herramientas') goTo('recursos', view.maquinaId, view.submaquinaId, view.actividadId, view.caldera);
  else if(view.screen==='recursos') goTo('actividades', view.maquinaId, view.submaquinaId, null, view.caldera);
  else if(view.screen==='actividades') goTo('submaquinas', view.maquinaId, null, null, view.caldera);
  else if(view.screen==='submaquinas') goTo('maquinas', null, null, null, view.caldera);
  else if(view.screen==='maquinas') goHome();
  else goHome();
}
function goTo(screen, maquinaId, submaquinaId, actividadId, caldera){
  view = {
    screen,
    caldera: caldera !== undefined ? caldera : view.caldera,
    maquinaId: maquinaId || null,
    submaquinaId: submaquinaId || null,
    actividadId: actividadId || null
  };
  searchQuery = '';
  render();
}
function goToCaldera(caldera){ goTo('maquinas', null, null, null, caldera); }
function getMachinesForCurrentCaldera(){ return state.maquinas.filter(m => m.caldera === view.caldera); }

const DATA_CACHE_KEY = 'tv_data_cache';
const DATA_CACHE_TIME_KEY = 'tv_data_cache_time';
let offlineMode = false;
let offlineSince = null;

async function loadData(){
  try{
    const { data, error } = await db
      .from('maquinas')
      .select('id, nombre, caldera, comentarios, submaquinas(id, nombre, equipo_no, ot, comentarios, actividades(id, nombre, comentarios, materiales(id, nombre, cantidad, especificacion, codigo, comentarios, imagen_url), herramientas(id, nombre, cantidad, especificacion, codigo, comentarios, imagen_url)))')
      .order('created_at', { ascending: true });
    if(error) throw error;
    state.maquinas = (data || []).map(mq => ({
      id: mq.id, nombre: mq.nombre, caldera: mq.caldera || '', comentarios: mq.comentarios || '',
      submaquinas: (mq.submaquinas || []).map(sm => ({
        id: sm.id, nombre: sm.nombre, equipo_no: sm.equipo_no || '', ot: sm.ot || '', comentarios: sm.comentarios || '',
        actividades: (sm.actividades || []).map(a => ({
          id: a.id, nombre: a.nombre, comentarios: a.comentarios || '', materiales: a.materiales || [], herramientas: a.herramientas || []
        }))
      }))
    }));
    loadError = null;
    offlineMode = false;
    try{
      localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(state.maquinas));
      localStorage.setItem(DATA_CACHE_TIME_KEY, String(Date.now()));
    }catch(cacheErr){ /* si no hay espacio, seguimos igual */ }
  }catch(e){
    let cached = null;
    try{ cached = localStorage.getItem(DATA_CACHE_KEY); }catch(readErr){ cached = null; }
    if(cached){
      state.maquinas = JSON.parse(cached);
      offlineMode = true;
      offlineSince = localStorage.getItem(DATA_CACHE_TIME_KEY);
      loadError = null;
    } else {
      loadError = 'No se pudo conectar con la base de datos. Revisa tu conexion e intenta de nuevo.';
    }
  }
  dataLoaded = true;
  render();
}

function onSearchInput(input){
  const cursorPos = input.selectionStart;
  searchQuery = input.value;
  render();
  const newInput = document.querySelector('.search-wrap input');
  if(newInput){
    newInput.focus();
    newInput.setSelectionRange(cursorPos, cursorPos);
  }
}
function clearSearch(){ searchQuery = ''; render(); }

function searchResults(){
  const q = searchQuery.trim().toLowerCase();
  const maquinas = [];
  const submaquinas = [];
  const actividades = [];
  const materiales = [];

  state.maquinas.forEach(mq => {
    if(mq.nombre.toLowerCase().includes(q)) maquinas.push(mq);
    mq.submaquinas.forEach(sm => {
      const smHay = [sm.nombre, sm.equipo_no, sm.ot].join(' ').toLowerCase();
      if(smHay.includes(q)) submaquinas.push({ mq, sm });
      sm.actividades.forEach(a => {
        if(a.nombre.toLowerCase().includes(q)) actividades.push({ mq, sm, a });
        a.materiales.forEach(mat => {
          const hay = [mat.nombre, mat.codigo, mat.especificacion].join(' ').toLowerCase();
          if(hay.includes(q)) materiales.push({ mq, sm, a, mat });
        });
      });
    });
  });

  return { maquinas, submaquinas, actividades, materiales };
}

/* ---- visor de imagen ---- */
let imageZoom={scale:1,x:0,y:0,pinchStart:0,pinchScale:1,startX:0,startY:0,lastX:0,lastY:0,dragging:false};
function openImage(url,alt){
  const o=document.createElement('div');o.className='image-lightbox';o.id='image-lightbox';
  o.innerHTML=`<button class="close-image" onclick="closeImage()">&times;</button><img id="lightbox-image" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}"><div class="image-hint">Pellizca para ampliar · Arrastra para mover</div>`;
  document.body.appendChild(o); imageZoom={scale:1,x:0,y:0,pinchStart:0,pinchScale:1,startX:0,startY:0,lastX:0,lastY:0,dragging:false};
  o.onclick=e=>{if(e.target===o)closeImage()};
  const img=document.getElementById('lightbox-image');
  img.addEventListener('touchstart',imageTouchStart,{passive:false});img.addEventListener('touchmove',imageTouchMove,{passive:false});img.addEventListener('touchend',imageTouchEnd,{passive:false});
}
function closeImage(){const o=document.getElementById('image-lightbox');if(o)o.remove()}
function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function imageTouchStart(e){
  if(e.touches.length===2){imageZoom.pinchStart=touchDistance(e.touches[0],e.touches[1]);imageZoom.pinchScale=imageZoom.scale}
  else if(e.touches.length===1){imageZoom.dragging=imageZoom.scale>1;imageZoom.startX=e.touches[0].clientX;imageZoom.startY=e.touches[0].clientY;imageZoom.lastX=imageZoom.x;imageZoom.lastY=imageZoom.y}
}
function imageTouchMove(e){
  e.preventDefault();
  if(e.touches.length===2&&imageZoom.pinchStart){imageZoom.scale=Math.max(1,Math.min(5,imageZoom.pinchScale*touchDistance(e.touches[0],e.touches[1])/imageZoom.pinchStart));if(imageZoom.scale===1){imageZoom.x=0;imageZoom.y=0}updateImageTransform()}
  else if(e.touches.length===1&&imageZoom.dragging){imageZoom.x=imageZoom.lastX+e.touches[0].clientX-imageZoom.startX;imageZoom.y=imageZoom.lastY+e.touches[0].clientY-imageZoom.startY;updateImageTransform()}
}
function imageTouchEnd(e){if(e.touches.length<2)imageZoom.pinchStart=0;if(imageZoom.scale<=1.01){imageZoom.scale=1;imageZoom.x=0;imageZoom.y=0;updateImageTransform()}}
function updateImageTransform(){const img=document.getElementById('lightbox-image');if(img)img.style.transform=`translate(${imageZoom.x}px,${imageZoom.y}px) scale(${imageZoom.scale})`}

  const overlay = document.createElement('div');
  overlay.className = 'overlay';

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.72;
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > height && width > maxDim){ height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if(!blob){ resolve(file); return; }
          const baseName = (file.name || 'foto').replace(/\.[^.]+$/, '');
          resolve(new File([blob], baseName + '.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(file);
    reader.readAsDataURL(file);
  });
}

async function onImagePicked(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const box = document.getElementById('img-preview-box');
  if(box) box.innerHTML = `<div class="img-preview-ph">Comprimiendo...</div>`;
  const compressed = await compressImage(file);
  pendingImage.file = compressed;
  pendingImage.previewUrl = URL.createObjectURL(compressed);
  renderImagePreview();
}
function renderImagePreview(){
  const box = document.getElementById('img-preview-box');
  if(!box) return;
  box.innerHTML = pendingImage.previewUrl
    ? `<img class="img-preview" src="${pendingImage.previewUrl}" alt="preview" />`
    : `<div class="img-preview-ph">Sin foto</div>`;
}

async function uploadImageIfNeeded(){
  if(!pendingImage.file) return null;
  const ext = (pendingImage.file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `materiales/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await db.storage.from('materiales-fotos').upload(path, pendingImage.file);
  if(error) return { error };
  const { data } = db.storage.from('materiales-fotos').getPublicUrl(path);
  return { url: data.publicUrl };
}

async function submitResource(maquinaId,submaquinaId,actividadId,resourceId,type){
  const nombre=document.getElementById('f-nombre').value.trim(),cantidad=document.getElementById('f-cantidad').value.trim(),especificacion=document.getElementById('f-especificacion').value.trim(),codigo=document.getElementById('f-codigo').value.trim(),comentarios=document.getElementById('f-comentarios').value.trim();
  if(!nombre||!cantidad){showErr('El nombre y la cantidad son obligatorios.');return;}
  const mq=getMaquina(maquinaId),sm=getSubmaquina(mq,submaquinaId),a=getActividad(sm,actividadId),arr=type==='herramienta'?(a.herramientas||(a.herramientas=[])):a.materiales;
  setSaving(true); let imagen_url=resourceId?(arr.find(x=>x.id===resourceId).imagen_url||null):null;
  const u=await uploadImageIfNeeded(); if(u&&u.error){setSaving(false);showErr('No se pudo subir la foto. Intenta de nuevo.');return;} if(u&&u.url)imagen_url=u.url;
  const table=type==='herramienta'?'herramientas':'materiales',payload={actividad_id:actividadId,nombre,cantidad,especificacion,codigo,comentarios,imagen_url};
  if(resourceId){const {error}=await db.from(table).update(payload).eq('id',resourceId);setSaving(false);if(error){showErr('No se pudo guardar. Intenta de nuevo.');return;}Object.assign(arr.find(x=>x.id===resourceId),payload);}
  else{const {data,error}=await db.from(table).insert(payload).select().single();setSaving(false);if(error){showErr('No se pudo guardar. Intenta de nuevo.');return;}arr.push(data);}
  closeSheet();render();
}
